name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    uses: Project-Arrakis/.github/.github/workflows/reusable-link-check.yml@main
    with:
      paths: "README.md CHANGELOG.md"
      # mentat, mentat-link, and meta are private repos -- GitHub 404s a
      # correct cross-repo link into any of them for an anonymous request,
      # so exclude the pattern rather than eat permanent false positives.
      exclude: 'github\.com/Project-Arrakis/(mentat|mentat-link|meta)(/|$)'

  docs-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Project-Arrakis/.github/.github/workflows/reusable-docs-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      paths: "README.md CHANGELOG.md"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm test
